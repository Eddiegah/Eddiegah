<svg width="100%" viewBox="0 0 1200 180" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Session closed — footer banner</title>
<defs>
<linearGradient id="fbg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#1d0a30"/>
<stop offset="100%" stop-color="#0a0118"/>
</linearGradient>
<linearGradient id="ftitle" x1="0" y1="0" x2="1" y2="0">
<stop offset="0%" stop-color="#05d9e8"/>
<stop offset="100%" stop-color="#ff2fb5"/>
</linearGradient>
</defs>

<rect x="0" y="0" width="1200" height="180" fill="url(#fbg)"/>

<line x1="0" y1="0" x2="1200" y2="0" stroke="#ff5f9e" stroke-width="1.5" opacity="0.5"/>
<g stroke="#05d9e8" stroke-width="1" opacity="0.3">
<line x1="0" y1="30" x2="1200" y2="30"/>
<line x1="0" y1="60" x2="1200" y2="60"/>
<line x1="0" y1="90" x2="1200" y2="90"/>
</g>

<text x="70" y="70" font-family="Consolas, 'Fira Code', monospace" font-size="17" fill="#39ff9d">root@eddiegah:~$ <tspan fill="#e8e8f0">exit</tspan></text>
<text x="70" y="98" font-family="Consolas, 'Fira Code', monospace" font-size="14" fill="#8b8b9e">logout</text>
<text x="70" y="122" font-family="Consolas, 'Fira Code', monospace" font-size="14" fill="#8b8b9e">Connection to github.com closed.</text>

<text x="1130" y="100" text-anchor="end" font-family="Consolas, 'Fira Code', monospace" font-size="26" font-weight="700" fill="url(#ftitle)">keep building</text>

<rect x="1136" y="78" width="14" height="28" fill="#05d9e8">
<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.51;0.99;1" dur="1.1s" repeatCount="indefinite"/>
</rect>
</svg>
