<radialGradient id="glow" cx="50%" cy="50%" r="50%">
<stop offset="0%" stop-color="#ff5f9e" stop-opacity="0.55"/>
<stop offset="100%" stop-color="#ff5f9e" stop-opacity="0"/>
</radialGradient>
<clipPath id="sunClip"><circle cx="600" cy="205" r="82"/></clipPath>
<filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
<feGaussianBlur stdDeviation="6" result="blur"/>
<feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter>
</defs>

<rect x="0" y="0" width="1200" height="340" fill="url(#bg)"/>

<circle cx="600" cy="205" r="130" fill="url(#glow)"/>

