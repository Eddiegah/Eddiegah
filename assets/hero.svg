<svg width="100%" viewBox="0 0 1200 340" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Eddiegah — AI/ML engineer and systems builder, boot sequence banner</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#0a0118"/>
<stop offset="55%" stop-color="#150826"/>
<stop offset="100%" stop-color="#1d0a30"/>
</linearGradient>
<linearGradient id="sunGrad" x1="0" y1="0" x2="0" y2="1">
<stop offset="0%" stop-color="#ffd166"/>
<stop offset="45%" stop-color="#ff5f9e"/>
<stop offset="100%" stop-color="#7b2ff7"/>
</linearGradient>
<linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
